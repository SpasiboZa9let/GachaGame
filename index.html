```html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Тридевятое царство</title>

    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background: #171717;
            color: #eee;
            font-family: Arial, sans-serif;
        }

        button {
            font: inherit;
        }

        #root {
            min-height: 100vh;
        }
    </style>
</head>

<body>

<div id="root"></div>

<!--
    Babel будет обрабатывать JSX-файлы.
    type="text/babel" нужен для запуска JSX без сборщика.
-->

<script
    type="text/babel"
    data-type="module"
    src="./app.js">
</script>

</body>
</html>
```
